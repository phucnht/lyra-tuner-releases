name: Bug report
description: Something in Lyra Tuner does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0+1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone 16 Plus, iOS 26.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Metronome tab
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Screenshots or a screen recording help a lot.
    validations:
      required: true
