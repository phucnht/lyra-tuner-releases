name: Feature request
description: An idea that would make Lyra Tuner more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or practice habit behind the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Other apps that do this well, sketches, links.
